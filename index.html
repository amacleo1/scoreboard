<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Scorekeeper App by Ang</title>

<style>

body{
    margin:0;
    font-family:-apple-system, Arial, sans-serif;
    background:#111827;
    color:white;
    overflow:hidden;
}

/* SCOREBOARD */

#board{
    display:flex;
    height:calc(100vh - 35px);
}

.team{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 10px 45px 10px;
}

.name{
    width:100%;
    text-align:center;
    font-size:22px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    margin-bottom:10px;
}

.score{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:min(42vw,280px);
    font-weight:900;
    line-height:1;
}

.minus{
    width:50px;
    height:32px;

    border:none;
    border-radius:8px;

    background:rgba(255,255,255,.18);
    color:white;

    font-size:16px;
    font-weight:bold;

    margin-bottom:20px;
}

/* BOTTOM CONTROLS */

#controlBar{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:30px;

    display:flex;
    align-items:center;
    gap:8px;

    padding-left:8px;

    background:#111827;

    z-index:2000;
}

#settingsBtn{
    width:20px;
    height:20px;

    border:none;
    border-radius:50%;

    background:#2563eb;
    color:white;

    font-size:8px;
}

#resetBtn{
    width:50px;
    height:20px;

    border:none;
    border-radius:12px;

    background:#dc2626;
    color:white;

    font-size:8px;
    font-weight:bold;
}

/* POPUP */

#overlay{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.55);

    z-index:3000;
}

#settingsPanel{
    display:none;

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:min(85vw,320px);

    background:#1f2937;

    padding:10px;

    border-radius:16px;

    z-index:3001;

    box-shadow:0 0 30px rgba(0,0,0,.6);
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

input[type=text]{
    flex:1;

    border:none;
    border-radius:8px;

    padding:10px;
    font-size:16px;
}

input[type=color]{
    width:60px;
}

.panelButton{
    width:100%;

    padding:8px;

    margin-top:6px;

    border:none;
    border-radius:8px;

    color:white;

    font-size:13px;
}

#flipBtn{
    background:#f59e0b;
}

#applyBtn{
    background:#16a34a;
}

/* LANDSCAPE */

@media (orientation:landscape){

    #board{
        height:calc(100vh - 30px);
    }

    .score{
        font-size:min(52vh,520px);
    }

    .name{
        font-size:16px;
    }

    .minus{
        width:42px;
        height:24px;

        font-size:12px;

        margin-bottom:12px;
    }

    #settingsBtn{
        width:20px;
        height:20px;
        font-size:8px;
    }

    #resetBtn{
        width:50px;
        height:20px;
        font-size:8px;
    }
}

</style>
</head>

<body>

<div id="overlay"></div>

<div id="settingsPanel">

    <div class="row">
        <input id="teamAName" type="text" value="Team A">
        <input id="teamAColor" type="color" value="#e74c3c">
    </div>

    <div class="row">
        <input id="teamBName" type="text" value="Team B">
        <input id="teamBColor" type="color" value="#3498db">
    </div>

    <button id="flipBtn" class="panelButton">
        ⇄ Flip Sides
    </button>

    <button id="applyBtn" class="panelButton">
        Apply Changes
    </button>

</div>

<div id="board">

    <div class="team" id="teamA">

        <div class="name" id="nameA">Team A</div>

        <div class="score" id="scoreA">0</div>

        <button class="minus" id="minusA">-1</button>

    </div>

    <div class="team" id="teamB">

        <div class="name" id="nameB">Team B</div>

        <div class="score" id="scoreB">0</div>

        <button class="minus" id="minusB">-1</button>

    </div>

</div>

<div id="controlBar">

    <button id="settingsBtn">⚙️</button>

    <button id="resetBtn">Reset</button>

</div>

<script>

let scoreA = 0;
let scoreB = 0;

function updateDisplay(){

    document.getElementById("scoreA").textContent = scoreA;
    document.getElementById("scoreB").textContent = scoreB;
}

function applySettings(){

    document.getElementById("nameA").textContent =
        document.getElementById("teamAName").value || "Team A";

    document.getElementById("nameB").textContent =
        document.getElementById("teamBName").value || "Team B";

    document.getElementById("teamA").style.backgroundColor =
        document.getElementById("teamAColor").value;

    document.getElementById("teamB").style.backgroundColor =
        document.getElementById("teamBColor").value;
}

function toggleSettings(){

    const panel = document.getElementById("settingsPanel");
    const overlay = document.getElementById("overlay");

    if(panel.style.display === "block"){

        panel.style.display = "none";
        overlay.style.display = "none";

    }else{

        panel.style.display = "block";
        overlay.style.display = "block";
    }
}

applySettings();
updateDisplay();

document.getElementById("settingsBtn").addEventListener("click", function(e){

    e.preventDefault();
    e.stopImmediatePropagation();

    toggleSettings();

    return false;
});

document.getElementById("overlay").addEventListener("click", function(){

    toggleSettings();
});

document.getElementById("applyBtn").addEventListener("click", function(){

    applySettings();
    toggleSettings();
});

document.getElementById("flipBtn").addEventListener("click", function(){

    let tempName =
        document.getElementById("teamAName").value;

    document.getElementById("teamAName").value =
        document.getElementById("teamBName").value;

    document.getElementById("teamBName").value =
        tempName;

    let tempColor =
        document.getElementById("teamAColor").value;

    document.getElementById("teamAColor").value =
        document.getElementById("teamBColor").value;

    document.getElementById("teamBColor").value =
        tempColor;

    let tempScore = scoreA;
    scoreA = scoreB;
    scoreB = tempScore;

    applySettings();
    updateDisplay();
});

document.getElementById("teamA").addEventListener("click", function(e){

    if(e.target.id === "minusA") return;

    scoreA++;
    updateDisplay();
});

document.getElementById("teamB").addEventListener("click", function(e){

    if(e.target.id === "minusB") return;

    scoreB++;
    updateDisplay();
});

document.getElementById("minusA").addEventListener("click", function(e){

    e.stopPropagation();

    if(scoreA > 0){

        scoreA--;
        updateDisplay();
    }
});

document.getElementById("minusB").addEventListener("click", function(e){

    e.stopPropagation();

    if(scoreB > 0){

        scoreB--;
        updateDisplay();
    }
});

document.getElementById("resetBtn").addEventListener("click", function(e){

    e.preventDefault();
    e.stopImmediatePropagation();

    if(confirm("Reset scores?")){

        scoreA = 0;
        scoreB = 0;

        updateDisplay();
    }

    return false;
});

</script>

</body>
</html>
