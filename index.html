<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Volleyball Scorekeeper</title>

<meta name="theme-color" content="#111827">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#111827;
    color:white;
    padding:8px;
}

#setupArea{
    margin-bottom:10px;
}

.setup{
    display:grid;
    grid-template-columns:1fr 65px;
    gap:8px;
    margin-bottom:8px;
}

input[type="text"]{
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:18px;
    width:100%;
}

input[type="color"]{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
}

.start-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
    font-size:18px;
    font-weight:600;
}

.settings-btn{
    position:fixed;
    top:10px;
    right:10px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:20px;
    z-index:1000;
    display:none;
}

.reset-btn{
    position:fixed;
    top:10px;
    left:10px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#dc2626;
    color:white;
    font-size:20px;
    z-index:1000;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    height:calc(100vh - 16px);
}

.team{
    border-radius:22px;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    text-align:center;
    user-select:none;
}

.team-name{
    height:42px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(20px,3vw,32px);
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    font-size:min(35vw,280px);
    font-weight:900;
    line-height:1;
}

.minus-btn{
    width:90%;
    border:none;
    border-radius:18px;
    padding:18px;
    font-size:34px;
    font-weight:bold;
    background:rgba(255,255,255,.25);
    color:white;
}

@media (orientation:landscape){

    .scoreboard{
        height:calc(100vh - 16px);
    }

    .score{
        font-size:min(40vw,420px);
    }

    .minus-btn{
        width:80%;
        font-size:28px;
        padding:14px;
    }
}

</style>
</head>

<body>

<div id="setupArea">

    <div class="setup">
        <input id="nameA" type="text" value="Team A">
        <input id="colorA" type="color
