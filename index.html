<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Scorekeeper">

<title>Volleyball Scorekeeper</title>

<style>

body{
    margin:0;
    font-family:-apple-system, Arial, sans-serif;
    background:#111827;
    color:white;
}

#setup{
    padding:10px;
    display:none;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

input[type=text]{
    flex:1;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:10px;
}

input[type=color]{
    width:60px;
    border:none;
}

button{
    border:none;
    border-radius:10px;
}

#startBtn,
#applyBtn{
    width:100%;
    padding:12px;
    font-size:18px;
    background:#16a34a;
    color:white;
}

#settingsBtn{
    position:fixed;
    bottom:10px;
    left:10px;

    width:40px;
    height:40px;

    background:#2563eb;
    color:white;

    font-size:18px;

    z-index:1000;
}

#resetBtn{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);

    width:120px;
    height:40px;

    background:#dc2626;
    color:white;

    font-size:16px;
    font-weight:bold;

    z-index:1000;
}

#board{
    display:flex;
    height:calc(100vh - 60px);
}

.team{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:10px;
}

.name{
    width:100%;
    text-align:center;

    font-size:24px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    font-size:min(42vw,280px);
    font-weight:900;
    line-height:1;
}

.minus{
    width:50px;
    height:32px;

    padding:0;

    font-size:16px;
    font-weight:bold;

    background:rgba(255,255,255,0.20);
    color:white;
}

@media (orientation:landscape){

    #board{
        height:calc(100vh - 55px);
    }

    .name{
        font-size:20px;
    }

    .score{
        font-size:min(45vh,420px);
    }
}

</style>
</head>

<body>

<button id="settingsBtn">⚙️</button>
<button id="resetBtn">Reset</button>

<div id="setup">

    <div class="row">
        <input id="teamAName" type="text" value="Team A">
        <input id="teamAColor" type="color" value="#e74c3c">
    </div>

    <div class="row">
        <input id="teamBName" type="text" value="Team B">
        <input id="teamBColor" type="color" value="#3498db">
    </div>

    <button id="applyBtn">Apply Changes</button>

</div>

<div id="board">

    <div class="team" id="teamA">

        <div class="name" id="nameA">Team A</div>

        <div class="score" id="scoreA">0</div>

        <button class="minus" id="minusA">-1</button>

    </div>

    <div class="team" id="teamB">

        <div class="name" id="nameB">Team B</div>

        <div class="score" id="scoreB">0</div>

        <button class="minus" id="minusB">-1</button>

    </div>

</div>

<script>

let scoreA = 0;
let scoreB = 0;

function applySettings(){

    document.getElementById("nameA").textContent =
        document.getElementById("teamAName").value || "Team A";

    document.getElementById("nameB").textContent =
        document.getElementById("teamBName").value || "Team B";

    document.getElementById("teamA").style.backgroundColor =
        document.getElementById("teamAColor").value;

    document.getElementById("teamB").style.backgroundColor =
        document.getElementById("teamBColor").value;
}

function updateDisplay(){

    document.getElementById("scoreA").textContent = scoreA;
    document.getElementById("scoreB").textContent = scoreB;
}

applySettings();
updateDisplay();

document.getElementById("settingsBtn").onclick = function(){

    let setup = document.getElementById("setup");

    if(setup.style.display === "block"){
        setup.style.display = "none";
    } else {
        setup.style.display = "block";
    }
};

document.getElementById("applyBtn").onclick = function(){

    applySettings();

    document.getElementById("setup").style.display = "none";
};

document.getElementById("teamA").onclick = function(e){

    if(e.target.id !== "minusA"){

        scoreA++;
        updateDisplay();
    }
};

document.getElementById("teamB").onclick = function(e){

    if(e.target.id !== "minusB"){

        scoreB++;
        updateDisplay();
    }
};

document.getElementById("minusA").onclick = function(e){

    e.stopPropagation();

    if(scoreA > 0){
        scoreA--;
        updateDisplay();
    }
};

document.getElementById("minusB").onclick = function(e){

    e.stopPropagation();

    if(scoreB > 0){
        scoreB--;
        updateDisplay();
    }
};

document.getElementById("resetBtn").onclick = function(){

    if(confirm("Reset scores?")){

        scoreA = 0;
        scoreB = 0;

        updateDisplay();
    }
};

</script>

</body>
</html>
